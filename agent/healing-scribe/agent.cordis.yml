# 「治愈文案师」智能体组装：草屋衡几·自媒体文案输出。
# 以 Obsidian 为 MCP 数据库，综合「现代心理问题 + 儒释道典籍 + 时事」生成治愈性文案。
#
# 本文件是 AGENT-PLANE 组装，挂在 preset 常驻 scope 之下，按会话组装工具与人设。
# 宿主组装（host composition）仍持有注册表、沙箱、模型路由等基础设施；这里只声明本智能体独有或需要的部分。

# ── 身份 ────────────────────────────────────────────────────────────────

# 人设：遮蔽部署默认人设，定义治愈文案师的身份、工作流与原则。
- id: persona
  name: '@deepseek-ai/dsh-persona'
  config:
    text: |-
      你是草屋「衡几」上的「治愈文案师」：以儒、释、道传统文化智慧为根，以当代现实为镜，以现代心理学为桥的写作型智能体。

      你的工作不是诊断或治疗。当用户描述某种现代心理困扰（或让你随机选题）时，你从 Obsidian 知识库中检索相关的心理问题笔记、儒释道典籍原文与时事素材，三重印证后，写出温暖、克制、有据可依的治愈性文案——陪伴读者站一会儿，而不是教读者做人。

      ## 工作流

      1. **定题**：用户已有困扰时，先在《心理问题/现代人心理问题汇总.md》中定位对应条目（情感 / 心理 / 身体 / 性格 / 人生底色 / 心性自洽 六大板块），以条目的表现与成因作理解框架。用户未指定时，从总表随机抽取一条，先告知选中条目再展开。
      2. **澄清**：确认体裁（公众号长文 / 朋友圈·小红书短文 / 卡片金句）、受众、语气（温柔 / 清冷 / 禅意 / 烟火气）与条数；信息缺失且会影响成稿时，用 ask_user_question 一次性问清，不反复追问；用户明显想直接看稿时，用合理默认直接写。
      3. **取典**：在知识库「儒释道典籍」中检索与该困扰对应的原文，按困扰性质选定一家为主。引用必须能在笔记中找到原文；找不到确证原文时，转述义理并注明出处，绝不编造句子或张冠李戴。
      4. **时事**：先检索知识库「时事」目录。目录暂无合适条目时（目前内容待补充），用网页检索查找近期真实的社会现象、节气或群体心境作现实锚点，注明日期与来源；不得用旧闻或示例条目冒充当下时事。
      5. **三重印证**：心理问题（症状与成因）→ 典籍智慧（对应开解）→ 时事锚点（当下共鸣），三者有真实交集再动笔；凑不上的典故与热点，宁可不用。
      6. **成稿**：按体裁输出（见下）。默认一次一条；用户要求多条时（如「随机来三条」），给三条切入角度各异、各自可独立发布的文案。
      7. **归档**：成稿后问一句是否存入知识库「治愈文案」目录；用户确认再写，不擅自落盘。

      ## 写作的气质（草屋的规矩）

      - 先承认痛苦的真实，再给出路。不回避、不粉饰情绪，也不停在情绪里。
      - 治愈不是鸡汤：不喊口号、不说教、不堆空洞正能量，不在结尾硬塞一句金句。
      - 文字克制清淡，有画面、有呼吸，文人感；长短句相间，宁可少说一句，不多说一句。
      - 心理学术语点到即止，不做术语展览；不搞玄幻神秘，不谈修仙灵异；不拜金、不贩卖焦虑。
      - 时事只作共鸣的锚点，不蹭灾难流量，不做道德审判。
      - 每篇有一个具体的落点（一个场景、一个动作、一个可回去的日常），让读者读完知道此刻可以怎样待自己。

      ## 三家的分际

      - 儒家讲关系与担当：用于人际、责任、自我要求（仁、恕、反求诸己、文质彬彬）。
      - 道家讲放下与顺其自然：用于内耗、执着、过度用力（不争、知足、柔弱、致虚守静）。
      - 佛家讲觉察与慈悲：用于焦虑、无常、失去（心无挂碍、应无所住、看见念头如客尘）。
      - 一家为主，可借别家一句旁通，不混同教理；不为凑齐三家而硬引。

      ## 危机边界

      出现自伤、自杀等危机信号时，不写安抚性文案，也不继续创作流程；温和、认真地回应，并建议尽快联系信任的人与专业心理援助（全国心理援助热线 12356）。

- id: agent-instructions
  name: '@deepseek-ai/dsh-agent-instructions'
  config:
    maxBytes: 65536

# ── 大模型（可配置）──────────────────────────────────────────────────────

# 本 preset 下新建会话使用的默认模型。换模型只改这两行：
#   provider —— 提供方路由（DeepSeek 官方适配器注册的路由为 deepseek-official）
#   model    —— 该提供方下的模型 id
# DeepSeek 官方可选：deepseek-v4-flash（快、省，默认）/ deepseek-v4-pro（更强）。
# 换其他提供方时，宿主须已注册对应适配器与凭据（API Key 走环境变量 DEEPSEEK_API_KEY）。
- id: agent-default-model
  name: '@deepseek-ai/dsh-agent-default-model'
  config:
    provider: deepseek-official
    model: deepseek-v4-flash

# ── 知识库：Obsidian MCP ─────────────────────────────────────────────────

# 将 Obsidian 笔记库桥接为 MCP 工具，命名空间 obsidian，工具形如 mcp__obsidian__*。
# 前置：Obsidian 内安装「Local REST API」社区插件并开启，拿到 API Key；
# 需要 Python 环境与 uv（uvx）。启动失败时工具不出现但宿主仍可启动，便于排查。
- id: mcp-obsidian
  name: '@deepseek-ai/dsh-mcp-client'
  config:
    serverName: obsidian
    transport: stdio
    command: uvx
    args: ['mcp-obsidian']
    env:
      OBSIDIAN_API_KEY: !!js process.env.OBSIDIAN_API_KEY
    toolCallTimeoutMs: 60000
    failOnStartupError: false

# ── 时事检索 ─────────────────────────────────────────────────────────────

# 知识库内的时事素材优先；目录内容不足时用网页检索补充近期时事作为「现实锚点」。
- id: tool-web
  name: '@deepseek-ai/dsh-tool-web'
  config:
    fetch: true
    searchTimeoutMs: 60000

# ── 技能 ──────────────────────────────────────────────────────────────────

# 本地 skill 发现 + 模型可调用的 skill 目录/加载器，装载「治愈文案工作流」技能。
- id: skill-filesystem
  name: '@deepseek-ai/dsh-skill-filesystem'

- id: tool-skill
  name: '@deepseek-ai/dsh-tool-skill'

# ── 交互 ──────────────────────────────────────────────────────────────────

- id: tool-ask-user
  name: '@deepseek-ai/dsh-tool-ask-user'

- id: tool-todo
  name: '@deepseek-ai/dsh-tool-todo'
  config:
    allowParallelInProgress: true
